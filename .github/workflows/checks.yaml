name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra hf-mem
      - run: uv run --frozen --extra hf-mem ruff format --check .
      - run: uv run --frozen --extra hf-mem ruff check .
      - run: uv run --frozen --extra hf-mem ty check
