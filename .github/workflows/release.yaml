name: Release Python package

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    environment:
      name: pypi
      url: https://pypi.org/p/hf-vllm-recipe
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(uv version --short)"
      - run: uv sync --frozen --extra hf-mem
      - run: uv run --frozen --extra hf-mem ruff format --check .
      - run: uv run --frozen --extra hf-mem ruff check .
      - run: uv run --frozen --extra hf-mem ty check
      - run: uv run --frozen --extra hf-mem python -m unittest discover -s tests
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
